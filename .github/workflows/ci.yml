name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build doesn't need real keys; provide a dummy so any build-time
          # reads don't fail. Real values live in deployment env vars.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
